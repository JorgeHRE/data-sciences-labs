# Stack clínico — actividad 1: Postgres + Adminer.
# Se levanta con:  docker compose up -d

services:
  # --- Base de datos -------------------------------------------------------
  db:
    # Versión fija (no "latest"): así todos levantan exactamente lo mismo.
    image: postgres:16
    environment:
      # Los valores salen del archivo .env (que NO se sube a git).
      # La forma ${VAR:?msg} hace que "up" falle con un mensaje claro si falta.
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    volumes:
      # Volumen con nombre: los datos sobreviven a "down" (no a "down -v").
      - pgdata:/var/lib/postgresql/data
      # Scripts de inicialización: se ejecutan en orden alfabético y SOLO si el
      # volumen está vacío (primer arranque). ":ro" = solo lectura para el
      # contenedor; no necesita modificar tus scripts.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # "Arrancó" no es "está listo": el contenedor puede estar corriendo
      # mientras Postgres aún inicializa. Este test pregunta si ACEPTA
      # conexiones. Va con "-h 127.0.0.1" (TCP) a propósito: durante initdb
      # corre un servidor temporal que solo escucha por socket Unix; sin -h,
      # pg_isready lo daría por sano antes de tiempo.
      # "$$VAR": el doble $ evita que Compose lo sustituya en mi máquina; se
      # evalúa dentro del contenedor.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s      # cada cuánto se ejecuta el test
      timeout: 3s       # cuánto se espera la respuesta de cada test
      retries: 10       # fallos seguidos para marcarlo "unhealthy"
      start_period: 10s # margen inicial: los fallos aquí no cuentan
    ports:
      # Actividad 2: se publica para conectarme desde mi máquina (fuera de
      # Docker), pero SOLO en el loopback. Entre contenedores no hace falta:
      # Adminer y Jupyter lo alcanzan por la red interna como "db:5432".
      - "127.0.0.1:5432:5432"

  # --- Cliente web ---------------------------------------------------------
  adminer:
    image: adminer:4
    depends_on:
      - db
    ports:
      # Se publica SOLO en el loopback (127.0.0.1): únicamente esta máquina
      # lo ve. Con "8080:8080" escucharía en todas las interfaces (0.0.0.0)
      # y cualquiera en la red podría llegar al panel.
      - "127.0.0.1:8080:8080"

  # --- Notebook ------------------------------------------------------------
  jupyter:
    # Se construye con el Dockerfile.jupyter de esta carpeta.
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    depends_on:
      db:
        # No basta con que "db" haya arrancado: Jupyter espera a que esté SANO.
        condition: service_healthy
    environment:
      # Token de acceso: Jupyter ejecuta código arbitrario, no se deja abierto.
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?falta JUPYTER_TOKEN en .env}
      # Datos de conexión que el notebook lee con os.environ, para no escribir
      # la contraseña dentro del .ipynb (que sí se versiona).
      # PGHOST es el NOMBRE DEL SERVICIO: dentro de la red de Compose, "db"
      # se resuelve a la IP del contenedor de Postgres.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      PGDATABASE: ${POSTGRES_DB:?falta POSTGRES_DB en .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    volumes:
      # Bind mount: la carpeta ./notebooks de MI máquina (izquierda) aparece como
      # /home/jovyan/work dentro del contenedor (derecha). Es la carpeta de
      # trabajo que la imagen ya trae. Lo que edito en mi editor se ve en
      # Jupyter al instante, y lo que guarda Jupyter queda en mi disco,
      # así que sobrevive a "down -v" (a diferencia de un volumen con nombre).
      - ./notebooks:/home/jovyan/work
    ports:
      # Solo loopback, igual que Adminer.
      - "127.0.0.1:8888:8888"

volumes:
  pgdata:
