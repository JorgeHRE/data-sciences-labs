# MONOREPO: GitHub solo lee workflows desde .github/workflows/ en la RAÍZ del
# repo, por eso este archivo vive aquí y no dentro de s04-git-github/.
# Los pasos se ejecutan dentro de la subcarpeta del laboratorio 4 y el workflow
# solo se dispara si cambia ese laboratorio (o este mismo archivo).

name: CI s04

on:
  push:
    branches: [ "main" ]
    paths:
      - "s04-git-github/**"
      - ".github/workflows/ci-s04.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "s04-git-github/**"
      - ".github/workflows/ci-s04.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: s04-git-github

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Test with pytest
      run: |
        pytest
