# Paso 10: la TERCERA capa de calidad.
#   Capa 1: tests (pytest)       -> los corres tú, cuando te acuerdas.
#   Capa 2: pre-commit           -> corre solo, pero SOLO en tu máquina (y solo
#                                   si hiciste `pre-commit install` en ese clon).
#   Capa 3: CI (este archivo)    -> corre en un servidor de GitHub en cada push,
#                                   con un clon limpio. No depende de tu .venv
#                                   ni de que alguien haya instalado pre-commit.
#
# Adaptado del workflow del laboratorio 4 (s04-git-github/.github/workflows/ci.yml).

# MONOREPO: GitHub solo lee workflows desde .github/workflows/ en la RAÍZ del
# repo, por eso este archivo vive aquí y no dentro de s05-buenas-practicas-pytest/.
# Todos los pasos se ejecutan dentro de la subcarpeta del laboratorio 5 y el
# workflow solo se dispara si cambia ese laboratorio (o este mismo archivo).

name: CI s05

on:
  push:
    branches: ["main"]
    paths:
      - "s05-buenas-practicas-pytest/**"
      - ".github/workflows/ci-s05.yml"
  # Sin filtro `paths` en pull_request: si el check `calidad` es obligatorio,
  # tiene que reportarse en TODO PR, aunque no toque s05 (si no, el PR queda
  # esperando un check que nunca corre y no se puede mergear).
  pull_request:
    branches: ["main"]

jobs:
  calidad:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: s05-buenas-practicas-pytest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      # 1) Descarga el código del repo en la máquina virtual.
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # 2) Instala Python.
      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: s05-buenas-practicas-pytest/pyproject.toml

      # 3) Instalar el paquete y sus herramientas.
      # Se instala el paquete en modo editable con el extra [dev], excluyendo [notebook].
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 4) Estilo y errores estáticos.
      # --check en format asegura que falle si hay archivos desalineados sin modificarlos en el runner.
      - name: Lint con ruff
        run: |
          ruff check .
          ruff format --check .

      # 5) Tipos estáticos (Capa 3 independiente de pre-commit local).
      - name: Chequeo de tipos con mypy
        run: |
          mypy src/

      # 6) Tests unitarios y cobertura.
      # Toma addopts desde pyproject.toml (--cov=clinlab --cov-fail-under=80).
      - name: Tests con pytest
        run: |
          pytest
