# Postgres propio del lab 12 (OMOP CDM v5.4). Independiente de proyecto-rag-omop.
#   docker compose up -d db      -> levantar la base
#   docker compose down          -> detenerla (los datos persisten en el volumen)
#   docker compose down -v       -> detenerla y BORRAR los datos
# Credenciales en .env (copia .env.example; .env está en .gitignore).

name: lab12-omop   # prefijo propio: volumen y red no chocan con otros proyectos

services:
  db:
    image: postgres:16.15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 5433 en el host: deja libre el 5432 por si el otro proyecto está activo.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Carga masiva de ~3 GB de vocabularios: más memoria para construir índices
    # y un WAL grande para que no haya checkpoints constantes.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - maintenance_work_mem=2GB
      - -c
      - max_wal_size=8GB
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ETL-Synthea (actividad 2). Perfil "etl": no arranca con `up -d db`; se lanza a mano:
  #   docker compose run --rm etl
  etl:
    profiles: ["etl"]
    build: ./etl
    image: lab12-etl-synthea
    depends_on:
      db:
        condition: service_healthy   # espera al healthcheck de la base
    environment:
      DB_HOST: db                    # nombre del servicio: la red de compose lo resuelve
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SYNTHEA_CSV_DIR: /data/synthea
    volumes:
      - ./etl:/etl:ro                # scripts del ETL: se editan sin reconstruir la imagen
      # CSV de Synthea v3.3.0 (5,000 pacientes), generados en la sesión 10; solo lectura.
      - ../../s10-sql-fundamentals/tu-entrega/data/synthea/csv:/data/synthea:ro

volumes:
  pgdata:
