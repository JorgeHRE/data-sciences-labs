# Postgres propio del lab 12 (OMOP CDM v5.4). Independiente de proyecto-rag-omop.
#   docker compose up -d db      -> levantar la base
#   docker compose down          -> detenerla (los datos persisten en el volumen)
#   docker compose down -v       -> detenerla y BORRAR los datos
# Credenciales en .env (copia .env.example; .env está en .gitignore).

name: lab12-omop   # prefijo propio: volumen y red no chocan con otros proyectos

services:
  db:
    image: postgres:16.15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 5433 en el host: deja libre el 5432 por si el otro proyecto está activo.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Carga masiva de ~3 GB de vocabularios: más memoria para construir índices
    # y un WAL grande para que no haya checkpoints constantes.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - maintenance_work_mem=2GB
      - -c
      - max_wal_size=8GB
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
